name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# runner は qa-workflows 側で vars.GATE_RUNNER (org: linux-general) → ubuntu-latest を自動選択する
jobs:
  go-test:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/go-test.yml@ea9ddf743bd492a13ceb4aa7c1c54cc33e49f72d # qa-workflows main(固定。#314)
    permissions:
      contents: read
      pull-requests: write
    with:
      go-version: "1.26"
      coverage-threshold: 50
      test-flags: "-race -count=1 -timeout 120s"
