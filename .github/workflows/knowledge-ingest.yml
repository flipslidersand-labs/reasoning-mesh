name: Knowledge Ingest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need HEAD~1 for diff

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8  # 固定(.golangci.yml は v1 形式。latest は v2 になり壊れる。CONTRIBUTING.md 参照)
          install-mode: goinstall

      # テスト・vet・カバレッジ閾値・PR コメントは ci.yml(go-test)が担う。
      # ここは ingest ジョブへ渡す CI ログ用に push のときだけ走らせる(#225)。
      - name: Run tests (CI log for ingest)
        if: ${{ github.event_name == 'push' }}
        run: |
          go test -race ./... -count=1 2>&1 | tee /tmp/test.log
          exit "${PIPESTATUS[0]}"

      - name: Upload test log
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.log
          retention-days: 7

  ingest:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name == 'push' && vars.LLMO_TRIGGER_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download test log
        uses: actions/download-artifact@v4
        with:
          name: test-log
          path: /tmp

      - name: Build diff + CI log payload
        id: payload
        run: |
          DIFF=$(git diff HEAD~1 HEAD -- '*.go' | head -c 32768)
          COMMIT_SHA=${{ github.sha }}
          CI_LOG=$(tail -c 8192 /tmp/test.log 2>/dev/null || echo "")
          # Emit as escaped JSON string via file to avoid shell quoting issues
          jq -n \
            --arg sha "$COMMIT_SHA" \
            --arg diff "$DIFF" \
            --arg ci_log "$CI_LOG" \
            '{"commit_sha": $sha, "diff": $diff, "ci_log": $ci_log}' > /tmp/trigger_payload.json
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: POST /v1/trigger
        run: |
          curl -sf -X POST "${{ vars.LLMO_TRIGGER_URL }}/v1/trigger" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.LLMO_TRIGGER_TOKEN }}" \
            --data @/tmp/trigger_payload.json \
            --max-time 10 \
          && echo "trigger accepted for ${{ steps.payload.outputs.sha }}" \
          || echo "trigger failed (non-fatal)"
        continue-on-error: true
